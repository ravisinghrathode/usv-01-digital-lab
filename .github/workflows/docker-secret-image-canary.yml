name: USV-01 Docker Synthetic Secret Image Canary

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - scripts/security/docker-image-secret-canary.py
      - .github/workflows/docker-secret-image-canary.yml
      - tests/docker_image_secret_canary_test.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usv01-docker-image-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-both-image-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker daemon and fail closed if unavailable
        run: docker info >/dev/null
      - name: Execute archive manifest regression tests
        run: python3 -m unittest discover -s tests -p 'docker_image_secret_canary_test.py' -v
      - name: Build and scan synthetic secret fixtures in build and runtime images
        run: python3 scripts/security/docker-image-secret-canary.py
      - name: Validate production compose contract
        run: docker compose config --quiet
