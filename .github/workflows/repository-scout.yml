name: USV-01 Repository Scout (read-only)

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Only validate the source register; do not run new GitHub discovery or create PRs'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 2 * * 1'
  pull_request:
    paths:
      - 'scripts/repository-scout.mjs'
      - 'scripts/repository-integration-planner.mjs'
      - 'scripts/external-integration-agent.mjs'
      - 'scripts/a26-unified-governance.mjs'
      - 'tests/a26-unified-governance.test.mjs'
      - 'config/a26-unified-operating-profile.json'
      - 'docs/governance/A26_UNIFIED_AGENT_OPERATING_CHARTER.md'
      - 'src/core/agents/GlobalUsvIntelligenceAgent.ts'
      - 'scripts/a26-static-audit.mjs'
      - 'scripts/a26-all97-review.mjs'
      - 'tests/a26-all97-review.test.mjs'
      - 'references/third-party-static-audits/A26_ALL_97_REVIEW_QUEUE_2026-11-17.json'
      - '.github/workflows/a26-all97-source-screen.yml'
      - 'scripts/a26-analytical-oracles.mjs'
      - 'tests/a26-analytical-oracles.test.mjs'
      - 'tests/a26-static-audit.test.mjs'
      - 'references/third-party-static-audits/**'
      - 'references/third-party-candidates/**'
      - 'docs/research/A26_P1_QUALIFICATION_2026-11-15.md'
      - 'config/external-integration-policy.json'
      - 'tests/external-integration-agent.test.mjs'
      - 'docs/EXTERNAL_INTEGRATION_AGENT_CHARTER.md'
      - 'tests/repository-integration-planner.test.mjs'
      - 'config/repository-scout.json'
      - 'src/data/externalSoftwareRegister.json'
      - 'src/components/ExternalSoftwareRegisterView.tsx'
      - 'src/App.tsx'
      - 'src/components/NavigationSidebar.tsx'
      - 'docs/EXTERNAL_SOFTWARE_OVERVIEW.md'
      - 'scripts/external-software-register.mjs'
      - 'scripts/external-software-usage.mjs'
      - 'scripts/run-fossen-evaluation.sh'
      - 'tests/external-software-register.test.mjs'
      - 'tests/external-software-usage.test.mjs'
      - '.github/workflows/fossen-usage-register.yml'
      - '.github/workflows/fossen-isolated-evaluation.yml'
      - 'tests/repository-scout.test.mjs'
      - '.github/workflows/repository-scout.yml'

permissions:
  contents: read

# Serialise publisher runs so the stable research branch advances without force pushes.
concurrency:
  group: a26-repository-scout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate scout (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests
        run: node --test tests/repository-scout.test.mjs tests/repository-integration.test.mjs tests/repository-integration-planner.test.mjs tests/external-software-register.test.mjs tests/external-software-usage.test.mjs tests/external-integration-agent.test.mjs tests/a26-static-audit.test.mjs tests/a26-analytical-oracles.test.mjs tests/a26-all97-review.test.mjs tests/a26-unified-governance.test.mjs
      - name: Enforce A26 unified naval-intelligence and integration charter (offline only)
        run: node scripts/a26-unified-governance.mjs --check
      - name: Verify all-97 review queue (offline, no approvals)
        run: node scripts/a26-all97-review.mjs --check
      - name: Verify current A26 pinned-source audits and license/safety review holds
        run: node scripts/a26-static-audit.mjs --check
      - name: Validate permanent register and generated overview
        run: node scripts/external-software-register.mjs --check

  discover:
    name: Search public GitHub repositories
    if: github.event_name != 'pull_request' && inputs.validate_only != true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bounded read-only scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/repository-scout.mjs
          --out-dir "$RUNNER_TEMP/repository-scout"
          --max-queries 24
          --per-query 12
          --limit 300
      - name: Draft source-pinned investigation queue (never executes external code)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/repository-integration-planner.mjs
          --scout-report "$RUNNER_TEMP/repository-scout/latest.json"
          --out-dir "$RUNNER_TEMP/repository-scout"
          --limit 5
      - name: Draft A26 governed adapter and independent-test review packages for pinned registered candidates
        run: >-
          node scripts/external-integration-agent.mjs prepare-all
          --out-dir "$RUNNER_TEMP/repository-scout/a26-review-packages"
      - name: Propose changes to reviewed register from new discoveries (never auto-approve)
        run: >-
          node scripts/external-software-register.mjs
          --scout-report "$RUNNER_TEMP/repository-scout/latest.json"
          --proposal-out "$RUNNER_TEMP/repository-scout/external-register-proposal.json"
      - name: Auto-publish read-only repository discovery snapshot (no PR)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/repository-scout/latest.json"
          test -s "$REPORT"
          node -e '
            const fs=require("node:fs");
            const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(report.schemaVersion!==1||report.provider!=="GITHUB_PUBLIC_REPOSITORY_SEARCH"||
              !Array.isArray(report.candidates)||report.completedQueries<1||
              report.candidates.length>300||!report.candidates.every(r=>
                typeof r.name==="string" && r.url==="https://github.com/"+r.name &&
                r.adoptionStatus==="DISCOVERED_AWAITING_HUMAN_AND_INDEPENDENT_REVIEW"))
              throw Error("Unsafe repository discovery cannot be published");
          ' "$REPORT"
          BRANCH="research/live-code-repositories"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi
          mkdir -p references/live-research
          node -e '
            const fs=require("node:fs");
            const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const output={
              schemaVersion:1,agentId:"INTEL-USV-26",
              classification:"PUBLIC_SOURCE_SAFE_ONLY",
              reviewStatus:"UNVERIFIED_REVIEW_REQUIRED",
              engineeringReleaseApproved:false,softwareAdoptionApproved:false,
              runId:process.env.GITHUB_RUN_ID,sourceRevision:process.env.GITHUB_SHA,
              generatedAt:report.generatedAt,provider:report.provider,
              completedQueries:report.completedQueries,plannedQueries:report.plannedQueries,
              coverageComplete:false,errors:report.errors,candidates:report.candidates
            };
            fs.writeFileSync("references/live-research/repository-scout.json",JSON.stringify(output,null,2)+"\n");
          ' "$REPORT"
          git add references/live-research/repository-scout.json
          git commit -m "data(a26): update unverified public code discoveries from run $GITHUB_RUN_ID"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Research-only repository feed refreshed, with no PR or adoption approval: https://github.com/ravisinghrathode/usv-01-digital-lab/tree/$BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unverified discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usv01-repository-scout
          path: ${{ runner.temp }}/repository-scout/
          if-no-files-found: error
          retention-days: 30
