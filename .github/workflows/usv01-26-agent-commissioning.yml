name: USV-01 26-Agent Authenticated ChatGPT Commissioning

# GitHub Actions in this PUBLIC repository run credential-free checks only.
# All authenticated model work takes place on an operator-approved local host.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Offline zero-model preflight or real ChatGPT/Codex campaign"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - live
      catalog_path:
        description: "Controlled input catalog path relative to repository root"
        required: true
        default: "evidence/live-agents/representative-cases.json"
        type: string

permissions:
  contents: read

concurrency:
  group: usv01-26-agent-commissioning
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected main revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install immutable dependencies
        run: bun install --frozen-lockfile
      - name: Validate private commissioning plan without model calls
        run: npm run mission-control:private-commission -- --plan
      - name: Source-level 26-agent preflight with zero model calls
        env:
          CATALOG_PATH: ${{ inputs.catalog_path }}
        run: npm run acceptance:codex-agents -- --catalog "$CATALOG_PATH" --require-ready
      - name: Produce fail-closed three-gate assessment
        run: npm run acceptance:full-26 -- --source-sha "$GITHUB_SHA"
      - name: Upload unverified preflight and blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usv01-26-agent-zero-model-preflight
          path: |
            data/codex-26-agent-preflight.json
            governance/reports/26-agent-engineering-campaign-status.json
          if-no-files-found: warn
          retention-days: 30

  # PUBLIC REPOSITORY SECURITY BLOCK:
  # Do not register a credential-bearing self-hosted runner here. A PR from
  # an untrusted fork could create another workflow targeting its label.
  # Authenticated Codex/Gemini commissioning uses the locally approved host,
  # never GitHub-hosted or self-hosted Actions on this public repo.
  live:
    if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block credentialed live model work on public GitHub Actions
        shell: bash
        run: |
          echo "::error::USV_PUBLIC_RUNNER_BLOCKED: this repository is public. Never register an OAuth/Ed25519-key holding self-hosted runner here."
          echo "Commission locally on a separately approved host: npm run mission-control:private-commission -- --source-sha <reviewed-sha> --catalog <controlled-catalog> --execute"
          exit 1
