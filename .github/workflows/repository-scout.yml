name: USV-01 Repository Scout (read-only)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
  pull_request:
    paths:
      - 'scripts/repository-scout.mjs'
      - 'scripts/repository-integration-planner.mjs'
      - 'tests/repository-integration-planner.test.mjs'
      - 'config/repository-scout.json'
      - 'src/data/externalSoftwareRegister.json'
      - 'src/components/ExternalSoftwareRegisterView.tsx'
      - 'src/App.tsx'
      - 'src/components/NavigationSidebar.tsx'
      - 'docs/EXTERNAL_SOFTWARE_OVERVIEW.md'
      - 'scripts/external-software-register.mjs'
      - 'tests/external-software-register.test.mjs'
      - 'tests/repository-scout.test.mjs'
      - '.github/workflows/repository-scout.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate scout (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests
        run: node --test tests/repository-scout.test.mjs tests/repository-integration.test.mjs tests/repository-integration-planner.test.mjs tests/external-software-register.test.mjs
      - name: Validate permanent register and generated overview
        run: node scripts/external-software-register.mjs --check

  discover:
    name: Search public GitHub repositories
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bounded read-only scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/repository-scout.mjs
          --out-dir "$RUNNER_TEMP/repository-scout"
          --max-queries 18
          --per-query 30
          --limit 100
      - name: Draft source-pinned investigation queue (never executes external code)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/repository-integration-planner.mjs
          --scout-report "$RUNNER_TEMP/repository-scout/latest.json"
          --out-dir "$RUNNER_TEMP/repository-scout"
          --limit 5
      - name: Propose changes to reviewed register from new discoveries (never auto-approve)
        run: >-
          node scripts/external-software-register.mjs
          --scout-report "$RUNNER_TEMP/repository-scout/latest.json"
          --proposal-out "$RUNNER_TEMP/repository-scout/external-register-proposal.json"
      - name: Upload unverified discovery report
        uses: actions/upload-artifact@v4
        with:
          name: usv01-repository-scout
          path: ${{ runner.temp }}/repository-scout/
          if-no-files-found: error
          retention-days: 30