name: USV-01 Safety & Governance Branch Protection Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  governance-verification:
    name: Deterministic Quality & Governance Gate
    runs-on: ubuntu-latest
    env:
      DIRECTOR_PUBLIC_KEY: ${{ vars.DIRECTOR_PUBLIC_KEY || secrets.DIRECTOR_PUBLIC_KEY }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CHATGPT_MODEL: ${{ vars.CHATGPT_MODEL || 'gpt-4o-mini' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Stage B — Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Stage B — DevSecOps Secret Scanning
        run: npx tsx scripts/governance/secret-scanner.ts

      - name: Stage B — Repository Governance Configuration Validation
        run: npx tsx scripts/governance/validate-config.ts

      - name: Stage B — Engineering Change Request (ECR) Integrity Validation
        run: npx tsx scripts/governance/ecr-tool.ts

      - name: Stage B — TypeScript Static Typecheck & Lint
        run: npm run lint

      - name: Stage B — Execute Deterministic & Safety Test Suite
        run: npm test

      - name: Stage B — Production Bundle Verification
        run: npm run build

      - name: Stage A — PR Change Classification
        if: github.event_name == 'pull_request'
        run: |
          npx tsx scripts/governance/classify-change.ts origin/main >> $GITHUB_STEP_SUMMARY

      - name: Stage C — Independent Technical Review
        id: stage_c
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          npx tsx scripts/governance/independent-ai-review.ts origin/main >> $GITHUB_STEP_SUMMARY

      - name: Stage D — Human Authority & ECR Authorization Verification
        id: stage_d
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          npx tsx scripts/governance/stage-d-human-approval.ts origin/main

      - name: Stage E — Governance Gate Enforcement
        if: github.event_name == 'pull_request'
        run: |
          echo "### 🛡️ NAVAL-USV Gate Evaluation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Stage C (Independent Review):** ${{ steps.stage_c.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Stage D (Human Authority):** ${{ steps.stage_d.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.stage_c.outcome }}" != "success" ] || [ "${{ steps.stage_d.outcome }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚫 **PR BLOCKED**: Both Stage C (Independent AI Review) and Stage D (Human Authority Approval) must pass before merging." >> $GITHUB_STEP_SUMMARY
            echo "::error::Governance gate blocked: Both Stage C and Stage D must pass."
            exit 1
          fi
