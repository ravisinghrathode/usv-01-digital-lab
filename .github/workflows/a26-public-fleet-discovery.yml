name: USV-01 A26 Worldwide Public Fleet Scout

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Only validate source register, no network or model calls'
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 2,5'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/a26-fleet-discovery.mjs'
      - 'scripts/a26-fleet-campaign.mjs'
      - 'scripts/a26-document-library.mjs'
      - 'scripts/a26-document-register.mjs'
      - 'scripts/a26-research-handoffs.mjs'
      - 'config/a26-document-research.json'
      - 'config/a26-fleet-discovery.json'
      - 'references/fleet-intelligence/**'
      - 'tests/a26-fleet-discovery.test.mjs'
      - 'tests/a26-document-library.test.mjs'
      - 'tests/a26-fleet-campaign.test.mjs'
      - 'tests/a26-research-handoffs.test.mjs'
      - '.github/workflows/a26-public-fleet-discovery.yml'
      - 'docs/research/A26_FLEET_DISCOVERY_QUEUE.md'
      - 'docs/research/A26_DOCUMENT_DISCOVERY_QUEUE.md'
      - 'docs/vault/usv-fleet/candidate-notes/**'

permissions:
  contents: read

concurrency:
  group: a26-fleet-scout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test public fleet collector without network or AI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      USV_ALLOW_PAID_AI_API: 'false'
      USV_NO_PAID_API: '1'
      USV_SUBSCRIPTION_PILOT: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline fleet ingestion, security and evidence tests
        run: node --test tests/a26-fleet-discovery.test.mjs tests/a26-document-library.test.mjs tests/a26-fleet-campaign.test.mjs tests/a26-research-handoffs.test.mjs
      - name: Validate governed research configuration and review registers
        run: |
          node scripts/a26-fleet-campaign.mjs --validate-only
          node scripts/a26-document-library.mjs --validate-only
          node scripts/a26-document-register.mjs --validate-only

  discover:
    name: Discover public worldwide naval USV research leads
    if: github.event_name != 'pull_request' && inputs.validate_only != true
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      USV_ALLOW_PAID_AI_API: 'false'
      USV_NO_PAID_API: '1'
      USV_SUBSCRIPTION_PILOT: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve bounded public RSS and Atom metadata with source receipts
        run: |
          set -euo pipefail
          node scripts/a26-fleet-campaign.mjs \
            --batch-size 24 --max-batches 4 \
            --out-dir "$RUNNER_TEMP/a26-fleet-scout"
      - name: Discover public scholarly papers and open licensed files
        continue-on-error: true
        run: |
          node scripts/a26-document-library.mjs \
            --out-dir "$RUNNER_TEMP/a26-documents" \
            --download-open-licensed --max-downloads 8
          node scripts/a26-document-register.mjs \
            --harvest "$RUNNER_TEMP/a26-documents/papers-and-references.json" \
            --out-dir "$RUNNER_TEMP/a26-documents"
      - name: Draft unverified engineering research questions from public evidence
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/a26-fleet-scout/latest.json" ]] &&
             [[ -f "$RUNNER_TEMP/a26-documents/papers-and-references.json" ]]; then
            node scripts/a26-research-handoffs.mjs \
              --fleet "$RUNNER_TEMP/a26-fleet-scout/latest.json" \
              --documents "$RUNNER_TEMP/a26-documents/papers-and-references.json" \
              --out-dir "$RUNNER_TEMP/a26-fleet-scout"
          else
            echo "Research handoff held: one or more source reports are unavailable."
          fi
      - name: Consolidate actual fleet, literature and USV source evidence (R3)
        run: |
          set -euo pipefail
          FLEET="$RUNNER_TEMP/a26-fleet-scout/latest.json"
          DOCS="$RUNNER_TEMP/a26-documents/document-register-proposal.json"
          if [[ ! -s "$FLEET" || ! -s "$DOCS" ]]; then
            echo 'R3 consolidation HOLD: fleet or knowledge evidence missing' >&2
            exit 1
          fi
          node scripts/a26/global-research.mjs collect --out "$RUNNER_TEMP/a26-snapshots"
          node scripts/a26/unified-evidence.mjs \
            --fleet "$FLEET" \
            --documents "$DOCS" \
            --snapshots "$RUNNER_TEMP/a26-snapshots/evidence-index.json" \
            --out "$RUNNER_TEMP/a26-unified"
          node scripts/a26/acceptance.mjs --index "$RUNNER_TEMP/a26-snapshots/evidence-index.json"
      - name: Upload unverified run evidence and Obsidian research drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a26-fleet-public-research-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/a26-fleet-scout/
            ${{ runner.temp }}/a26-documents/
            ${{ runner.temp }}/a26-snapshots/
            ${{ runner.temp }}/a26-unified/
          if-no-files-found: warn
          retention-days: 60
      - name: Auto-publish unverified research to dedicated live data branch (no PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/a26-fleet-scout/latest.json"
          PROPOSAL="$RUNNER_TEMP/a26-fleet-scout/proposal-register.json"
          test -s "$REPORT" && test -s "$PROPOSAL"
          test -s "$RUNNER_TEMP/a26-documents/document-register-proposal.json"
          test -s "$RUNNER_TEMP/a26-snapshots/evidence-index.json"
          test -s "$RUNNER_TEMP/a26-unified/unified-a26-evidence.json"
          SUCCESS="$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.sourcesSucceeded))' "$REPORT")"
          if [[ "$SUCCESS" -eq 0 ]]; then
            echo 'No successful source acquisition: refuse to publish new snapshot' >&2
            exit 1
          fi
          BRANCH="research/live-a26"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi
          cp "$PROPOSAL" references/fleet-intelligence/discovery-register.json
          cp "$RUNNER_TEMP/a26-documents/document-register-proposal.json" references/fleet-intelligence/document-register.json
          cp "$RUNNER_TEMP/a26-fleet-scout/review-queue.md" docs/research/A26_FLEET_DISCOVERY_QUEUE.md
          cp "$RUNNER_TEMP/a26-documents/document-review-queue.md" docs/research/A26_DOCUMENT_DISCOVERY_QUEUE.md
          mkdir -p references/a26-public-review docs/vault/usv-fleet/candidate-notes
          cp "$RUNNER_TEMP/a26-snapshots/evidence-index.json" references/a26-public-review/source-index.json
          cp "$RUNNER_TEMP/a26-unified/unified-a26-evidence.json" references/a26-public-review/unified-evidence.json
          node -e 'const fs=require("node:fs");fs.writeFileSync("references/a26-public-review/manifest.json",JSON.stringify({schemaVersion:1,agentId:"INTEL-USV-26",classification:"PUBLIC_SOURCE_SAFE_ONLY",reviewStatus:"UNVERIFIED_REVIEW_REQUIRED",runId:process.env.GITHUB_RUN_ID,headSha:process.env.GITHUB_SHA,createdAt:new Date().toISOString(),engineeringReleaseApproved:false},null,2)+"\n")'
          cp "$RUNNER_TEMP/a26-fleet-scout/candidate-notes/"*.md docs/vault/usv-fleet/candidate-notes/ 2>/dev/null || true
          node scripts/a26-fleet-campaign.mjs --validate-only
          node scripts/a26-document-register.mjs --validate-only
          git add references/fleet-intelligence/discovery-register.json \
            references/fleet-intelligence/document-register.json \
            references/a26-public-review/ \
            docs/research/A26_FLEET_DISCOVERY_QUEUE.md \
            docs/research/A26_DOCUMENT_DISCOVERY_QUEUE.md \
            docs/vault/usv-fleet/candidate-notes/
          git commit -m "data(a26): update unverified public research from run $GITHUB_RUN_ID"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Unverified research published without PR: https://github.com/ravisinghrathode/usv-01-digital-lab/tree/$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "No engineering baseline, software approval, or runtime code modified." >> "$GITHUB_STEP_SUMMARY"
