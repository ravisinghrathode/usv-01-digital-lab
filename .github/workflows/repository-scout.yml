name: USV-01 Repository Scout (read-only)

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Only validate the source register; do not run new GitHub discovery or create PRs'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 2 * * 1'
  pull_request:
    paths:
      - 'scripts/repository-scout.mjs'
      - 'scripts/repository-integration-planner.mjs'
      - 'scripts/external-integration-agent.mjs'
      - 'scripts/a26-unified-governance.mjs'
      - 'tests/a26-unified-governance.test.mjs'
      - 'config/a26-unified-operating-profile.json'
      - 'docs/governance/A26_UNIFIED_AGENT_OPERATING_CHARTER.md'
      - 'src/core/agents/GlobalUsvIntelligenceAgent.ts'
      - 'scripts/a26-static-audit.mjs'
      - 'scripts/a26-analytical-oracles.mjs'
      - 'tests/a26-analytical-oracles.test.mjs'
      - 'tests/a26-static-audit.test.mjs'
      - 'references/third-party-static-audits/**'
      - 'references/third-party-candidates/**'
      - 'docs/research/A26_P1_QUALIFICATION_2026-11-15.md'
      - 'config/external-integration-policy.json'
      - 'tests/external-integration-agent.test.mjs'
      - 'docs/EXTERNAL_INTEGRATION_AGENT_CHARTER.md'
      - 'tests/repository-integration-planner.test.mjs'
      - 'config/repository-scout.json'
      - 'src/data/externalSoftwareRegister.json'
      - 'src/components/ExternalSoftwareRegisterView.tsx'
      - 'src/App.tsx'
      - 'src/components/NavigationSidebar.tsx'
      - 'docs/EXTERNAL_SOFTWARE_OVERVIEW.md'
      - 'scripts/external-software-register.mjs'
      - 'scripts/external-software-usage.mjs'
      - 'scripts/run-fossen-evaluation.sh'
      - 'tests/external-software-register.test.mjs'
      - 'tests/external-software-usage.test.mjs'
      - '.github/workflows/fossen-usage-register.yml'
      - '.github/workflows/fossen-isolated-evaluation.yml'
      - 'tests/repository-scout.test.mjs'
      - '.github/workflows/repository-scout.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate scout (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests
        run: node --test tests/repository-scout.test.mjs tests/repository-integration.test.mjs tests/repository-integration-planner.test.mjs tests/external-software-register.test.mjs tests/external-software-usage.test.mjs tests/external-integration-agent.test.mjs tests/a26-static-audit.test.mjs tests/a26-analytical-oracles.test.mjs tests/a26-unified-governance.test.mjs
      - name: Enforce A26 unified naval-intelligence and integration charter (offline only)
        run: node scripts/a26-unified-governance.mjs --check
      - name: Verify current A26 pinned-source audits and license/safety review holds
        run: node scripts/a26-static-audit.mjs --check
      - name: Validate permanent register and generated overview
        run: node scripts/external-software-register.mjs --check

  discover:
    name: Search public GitHub repositories
    if: github.event_name != 'pull_request' && inputs.validate_only != true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bounded read-only scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/repository-scout.mjs
          --out-dir "$RUNNER_TEMP/repository-scout"
          --max-queries 24
          --per-query 12
          --limit 300
      - name: Draft source-pinned investigation queue (never executes external code)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/repository-integration-planner.mjs
          --scout-report "$RUNNER_TEMP/repository-scout/latest.json"
          --out-dir "$RUNNER_TEMP/repository-scout"
          --limit 5
      - name: Draft A26 governed adapter and independent-test review packages for pinned registered candidates
        run: >-
          node scripts/external-integration-agent.mjs prepare-all
          --out-dir "$RUNNER_TEMP/repository-scout/a26-review-packages"
      - name: Propose changes to reviewed register from new discoveries (never auto-approve)
        run: >-
          node scripts/external-software-register.mjs
          --scout-report "$RUNNER_TEMP/repository-scout/latest.json"
          --proposal-out "$RUNNER_TEMP/repository-scout/external-register-proposal.json"
      - name: Open a controlled review PR for new discoveries (never approve software)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROPOSAL="$RUNNER_TEMP/repository-scout/external-register-proposal.json"
          REPORT="$RUNNER_TEMP/repository-scout/latest.json"
          CURRENT_COUNT="$(node -e "const fs=require('fs');const old=require('./src/data/externalSoftwareRegister.json');const x=JSON.parse(fs.readFileSync(process.argv[1]));process.stdout.write(String(x.records.length-old.records.length))" "$PROPOSAL")"
          if [[ "$CURRENT_COUNT" -eq 0 ]]; then
            echo 'No new external repositories; current register remains authoritative.'
            exit 0
          fi
          OPEN="$(gh pr list --state open --limit 100 --json title --jq '[.[] | select(.title == "External software discovery queue (review required)")] | length')"
          if [[ "$OPEN" != 0 ]]; then
            echo 'A discovery-review PR is already open; preserving new candidates in the scan artifact without overwriting an unreviewed PR.'
            exit 0
          fi
          BRANCH="automation/external-software-discovery-$GITHUB_RUN_ID"
          cp "$PROPOSAL" src/data/externalSoftwareRegister.json
          node scripts/external-software-register.mjs --refresh
          node scripts/external-software-register.mjs --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add src/data/externalSoftwareRegister.json docs/EXTERNAL_SOFTWARE_OVERVIEW.md
          git commit -m "docs(register): propose $CURRENT_COUNT new public repository discoveries for review"
          gh auth setup-git
          git push -u origin "$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" \
            --title "External software discovery queue (review required)" \
            --body "Automated A26 discovery *proposal* from Scout run $GITHUB_RUN_ID. $CURRENT_COUNT new public GitHub identities are registered as DISCOVERED ONLY, with no executable permission, no accepted license/security/physics assessment, and no verified project usage. All project and engineering approvals remain separate. Review and curate before protected merge. Source: https://github.com/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID"; then
            echo '::warning::GitHub Actions could not create the review PR. The unapproved proposal branch and scan artifact remain available.'
            echo "Review branch: https://github.com/${{ github.repository }}/tree/$BRANCH" >> "$GITHUB_STEP_SUMMARY"
            echo "Scan artifact: https://github.com/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # GITHUB_TOKEN-created PRs do not emit normal pull_request check runs.
          # workflow_dispatch is an allowed exception; it checks the exact PR head.
          gh workflow run repository-scout.yml --ref "$BRANCH" -f validate_only=true
          gh workflow run safety-governance-gate.yml --ref "$BRANCH" -f run_openfoam=false
      - name: Upload unverified discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usv01-repository-scout
          path: ${{ runner.temp }}/repository-scout/
          if-no-files-found: error
          retention-days: 30
